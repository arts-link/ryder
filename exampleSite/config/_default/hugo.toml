# !!! exampleSite only — CI overrides this via --baseURL flag for GitHub Pages
baseURL = "https://example.org/"
languageCode= "en-us"
title= "The Ryder Theme"
theme= ["ryder"]
summaryLength = 15
enableRobotsTXT = true
copyright = "©️ Ryder Theme 2026"
enableEmoji = true
# enableGitInfo = true  # adds git commit links to footer; 40-50% slower on large sites

# !!! exampleSite only, you may need to delete the line: `themesDir: ../../`
themesDir= "../../"

# Only needed if you drive PostHog via PUBLIC_POSTHOG_* environment variables
# instead of the posthog_key/posthog_host params (see README > Analytics >
# PostHog). Hugo's getenv only allows vars matching ^HUGO_ or ^CI$ by default;
# without this explicit allowlist entry, a PUBLIC_POSTHOG_* var is blocked and
# the theme falls back to treating it as unset (with a build warning explaining
# why, when analytics_provider = "posthog"). Uncomment if you use the env var path.
# [security]
#   [security.funcs]
#     getenv = ['^HUGO_', '^CI$', '^PUBLIC_']

[pagination]
  pagerSize = 20
[params]
  description = 'A barebones Hugo theme built with TailwindCSS, Alpine.js, and Font Awesome. Practical defaults, no bloat.'
  # TODO: Add exampleSite analytics later under the arts-link account.
  tocOpen = true
  # enableDebugPanel = true
  # navbar_fixed = true
  excludedtags = ["sample","test","excluded"]
  showDate = true 
  showAuthor = true 
  showBreadCrumbs = true # defaults to true
  darkMode = "toggle" # "system" (default), "toggle", or "off"; showDarkToggle=true is a legacy alias for "toggle"
  showShareButtons = true # defaults to false
  showCardLinkOverlay = false # defaults to true
  showSummaryMeta = false # defaults to true
  showReadOn = true # defaults to false
  showHomeFeed = true # defaults to true 
  loadLeaflet = true # defaults to false
  og_image_default = 'images/ryder-theme-og.webp'
  homePageFeatureHeader = "Features"
  homePageFeedHeader = "Documentation"
  logo_firstWord = 'ryder'
  logo_lastWord = 'theme'
  logo_tagline = "FOR HUGO WEBSITES"
  logo_fontClass = 'font-titillium'
  repository = "https://github.com/arts-link/ryder"
  # articleBackgroundStyle = "bg-gradient-to-l from-blue-100 to-green-100"
  # featuredArticleBackgroundStyle = "bg-gradient-to-l from-yellow-200 to-lime-200"
  showPubDate = true
  # headerType = "-custom" # create layouts/partials/header-custom.html in your site
  # footerType = "-custom" # create layouts/partials/footer-custom.html in your site
  # menuType = "-custom" # create layouts/partials/menu-custom.html in your site
  # listCardType = "-custom" # create a matching card partial in your site
  # homeListCardType = "-custom"
  # homeFeatureListCardType = "-custom"

  # Content Security Policy — applied via <meta http-equiv="Content-Security-Policy">.
  # The theme ships with secure defaults. Extend per-directive as needed.
  # Set disabled = true if your hosting platform already sends a CSP HTTP header.
  [params.csp]
    # disabled = true
    # imgSrc    = "https:"                        # allow all HTTPS image sources (e.g. for external post images)
    # scriptSrc = "https://cdn.example.com"       # extra script hosts
    # styleSrc  = "https://cdn.example.com"       # extra style hosts
    # fontSrc   = "https://cdn.example.com"       # extra font hosts
    # connectSrc = "https://api.example.com"      # extra connect hosts
    # frameSrc = "https://your-embed-host.example.com" # any additional embed hosts, verbatim
    embeds = ["youtube", "vimeo", "soundcloud", "umap"] # known embed-host presets; folded into frame-src alongside auto-detected shortcode hosts
    # extraDirectives = "worker-src 'none';"      # append any additional directives

  [params.shareButtons]
    networks = [ "x", "email", "reddit", "facebook" ]
    # size = "small" # small, medium, large
    # icon = "solid" # normal, solid, circle, solidcircle
    # buttonMargin = "0.2em" 

  [params.ogImageText]
    x = 50
    y = 430
    fontName = "TitilliumWeb-Regular"

  [params.author]
    email = 'you@example.com'
    name = 'Ben Strawbridge'

  # ico/svg/appleTouchIcon default to the files the theme already ships
  # (favicon.ico, images/favicon.svg, images/apple-touch-icon.png) — only
  # webmanifest has no default, since the theme ships no manifest file.
  # Site-level only: head.html loads this partial via partialCached with no
  # explicit cache key, so it cannot vary per page.
  [params.favicon]
    webmanifest = "/site.webmanifest"
    # Set explicitly to the file the theme ships, so the e2e suite exercises a
    # site-supplied value rather than only the built-in default — the casing of
    # this key is load-bearing (Hugo lower-cases config keys, so the partial's
    # isset lookup must too), and a default-only test cannot catch getting it
    # wrong. Array-of-tables entries must come after every scalar key above.
    appleTouchIcon = "/images/apple-touch-icon.png"

  # Sized PNG icons — opt-in, no default, since the theme ships no such files.
  [[params.favicon.icons]]
    size = "32x32"
    href = "/images/favicon.svg"

  [params.twClasses]
    headerBackgroundFrameOuter = "bg-gradient-to-r from-slate-900 to-slate-700 border-b border-fuchsia-600 text-neutral-100"
    headerBackgroundFrameInner = "h-[240px] sm:h-[400px] bg-cover bg-center sm:bg-[center_30%]"
    headerBackgroundImage = "images/hyder_theme_header.webp"

[[params.alphaAlert]]
  weight = 1
  alertType = "success"
  alertTitle = "Ryder Theme for Hugo"
  alertMessage = "This is the <b>exampleSite</b>. Learn more about the theme by checking out the README on <a href='https://github.com/arts-link/ryder' class='underline'>on github.com</a>."
  dismissable = true 
  alertIconClass = "fa-solid fa-camera-retro"

  [params.footer]
    tagCloud = true

# Example: Configure footer taxonomies (optional, defaults to showing nothing)
[[params.footer.taxonomies]]
  name = "tags"
  title = "Top Tags"
  minCount = 2

[[params.footer.taxonomies]]
  name = "categories"
  title = "Categories"
  minCount = 3

[menus]
[[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    parent = 'docs'
    weight = 9990
# Conditional menu entries: hideIfEmptyData names a data/*.json file (shaped
# {"items": [...]}) that must be non-empty for the entry to render — see
# README > Menus and exampleSite/content/docs/list-layouts. "Press" shows
# because data/press.json has items; "Merch" stays hidden because
# data/merch.json does not exist (an empty items array behaves the same way).
[[menus.main]]
    name = 'Press'
    pageRef = '/press'
    weight = 45
    [menus.main.params]
      hideIfEmptyData = 'press'
[[menus.main]]
    name = 'Merch'
    url = '/merch/'
    weight = 46
    [menus.main.params]
      hideIfEmptyData = 'merch'
[[menus.footer]]
    name = 'File a Bug or Feature Request'
    url = 'https://github.com/arts-link/ryder/issues/new/choose'
    weight = 10
[[menus.footer]]
    name = 'Contact Us'
    pageRef = '/contact'
    weight = 10

[outputs]
  home = ["HTML", "RSS", "LLMSTxt"]

[module]
  [module.hugoVersion]
    extended = false
    min = "0.146.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"

# [build] is NOT inherited from the theme. Hugo merges only a subset of root
# config sections from themes, and `build` is not among them — verified by
# building a real consumer site against the theme and getting no
# hugo_stats.json at all. v0.2.4 removed this block on the assumption that
# inheritance covered it; that was wrong, and the effect was silent (Tailwind
# quietly falls back to the layouts globs, so only dynamically-assembled
# classes go missing).
#
# Every consuming site needs its own copy of this block. exampleSite is the
# reference implementation, so it carries one.
[build]
  writeStats = true
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(css|scss|sass)"
    target = "css"
