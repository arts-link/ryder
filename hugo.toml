[module]
  [module.hugoVersion]
    min = "0.146.0"
    extended = false

# `outputFormats` IS inherited by consuming sites — this is the definition of
# the LLMSTxt format, and a site can name "LLMSTxt" in its own [outputs]
# without declaring the format itself. Verified against a scratch consumer:
# with only `theme = "ryder"` set, `hugo config` reports
# [outputformats.llmstxt] present.
[outputFormats]
  [outputFormats.LLMSTxt]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

# `outputs`, by contrast, is NOT inherited — same story as [build] below. This
# block serves THIS repo's own builds only. Verified the same way: a consumer
# with only `theme = "ryder"` gets Hugo's stock
# `[outputs] home = ['html','rss']`, no llmstxt substep in the render log, and
# no llms.txt on disk. Adding `home = ["HTML", "RSS", "LLMSTxt"]` to the
# CONSUMER's config produces it.
#
# So a consuming site must declare [outputs] itself to get llms.txt. The
# README says so, and exampleSite carries its own copy — which is required,
# not redundant.
[outputs]
  home = ["HTML", "RSS", "LLMSTxt"]

# These serve THIS repo's own builds only. Hugo merges only a subset of root
# config sections from themes and `build` is NOT among them, so a consuming
# site does not inherit any of this — v0.2.4 assumed otherwise and was wrong.
# Consumers must copy this block into their own config; the README says so, and
# exampleSite carries its own copy as the reference implementation.
# writeStats feeds tailwind.config.js's hugo_stats.json content glob for class
# discovery; the cachebusters make `hugo server` pick up CSS/JS rebuilds after
# editing tailwind.config.js, postcss.config.js, or assets/**.
[build]
  writeStats = true
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"
