[module]
  [module.hugoVersion]
    min = "0.146.0"
    extended = false

[outputFormats]
  [outputFormats.LLMSTxt]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "LLMSTxt"]

# These serve THIS repo's own builds only. Hugo merges only a subset of root
# config sections from themes and `build` is NOT among them, so a consuming
# site does not inherit any of this — v0.2.4 assumed otherwise and was wrong.
# Consumers must copy this block into their own config; the README says so, and
# exampleSite carries its own copy as the reference implementation.
# writeStats feeds tailwind.config.js's hugo_stats.json content glob for class
# discovery; the cachebusters make `hugo server` pick up CSS/JS rebuilds after
# editing tailwind.config.js, postcss.config.js, or assets/**.
[build]
  writeStats = true
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"
